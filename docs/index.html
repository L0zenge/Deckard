<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deckard Cain's Tome of Identification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: width 0.4s ease, height 0.4s ease, max-width 0.4s ease, max-height 0.4s ease;
        }

        body {
            background-color: #0d0a08;
            background-image: radial-gradient(circle, #231812 0%, #0d0a08 100%);
            color: #d4c39e;
            font-family: 'MedievalSharp', cursive, serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .scene-stage {
            position: relative;
            width: 780px;
            height: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cain-sprite {
            position: absolute;
            left: 0px;
            bottom: 20px;
            width: 200px;
            height: auto;
            object-fit: contain;
            image-rendering: pixelated;
            filter: drop-shadow(2px 5px 10px rgba(0,0,0,0.8));
            z-index: 1;
        }

        .tome-bg-asset {
            position: absolute;
            right: 40px;
            top: 20px;
            width: 380px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.9));
            z-index: 2;
            opacity: 0.95;
        }

        .tome-container {
            background: #2b1a10;
            background-image: linear-gradient(135deg, #3d2517 0%, #1c100a 100%);
            border: 6px solid #5a3d28;
            outline: 2px solid #110b07;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.95), inset 0 0 15px rgba(0, 0, 0, 0.8);
            width: 440px;
            height: 440px;
            padding: 20px;
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
        }

        .tome-container.expanded {
            width: 88vw !important;
            max-width: 1200px;
            height: 88vh !important;
        }

        .tome-container::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 2px solid #8c6f3d;
            border-radius: 6px;
            pointer-events: none;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
            border-bottom: 2px solid #5a3d28;
            padding-bottom: 8px;
            flex-shrink: 0;
        }

        /* Header Tome Icon using tome.png */
        .header-tome-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: drop-shadow(0 0 4px #f3d283);
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #f3d283;
            font-size: 20px;
            text-shadow: 2px 2px 4px #000;
            letter-spacing: 1px;
            text-align: center;
        }

        p.quote {
            font-style: italic;
            color: #bfa882;
            text-align: center;
            margin-bottom: 12px;
            font-size: 13px;
            text-shadow: 1px 1px 2px #000;
            flex-shrink: 0;
        }

        .parchment {
            background-color: #d1be9c;
            background-image: linear-gradient(to bottom, #e2d2b4, #c2ae8a);
            color: #2b1a10;
            padding: 10px 12px;
            border-radius: 4px;
            border: 2px solid #7a5c3f;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.3);
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 4px;
            color: #3d2517;
        }

        input[type="text"] {
            width: 100%;
            padding: 7px;
            background: #f7eed8;
            border: 2px solid #5a3d28;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            color: #1c100a;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: #c9933b;
            box-shadow: 0 0 6px rgba(201, 147, 59, 0.6);
        }

        .btn-container {
            text-align: center;
            margin-top: 8px;
        }

        button {
            background: linear-gradient(to bottom, #a87932, #5c3f15);
            color: #fff1d0;
            font-family: 'Cinzel', serif;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 18px;
            border: 2px solid #f3d283;
            border-radius: 4px;
            cursor: pointer;
            text-shadow: 1px 1px 3px #000;
            box-shadow: 0 3px 8px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            background: linear-gradient(to bottom, #c9933b, #7a531d);
            transform: translateY(-1px);
            box-shadow: 0 0 10px rgba(243, 210, 131, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        .output-box {
            background: #110b07;
            border: 2px solid #5a3d28;
            border-radius: 4px;
            padding: 12px;
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .output-box h3 {
            font-family: 'Cinzel', serif;
            color: #f3d283;
            font-size: 14px;
            margin-bottom: 8px;
            border-bottom: 1px dashed #5a3d28;
            padding-bottom: 4px;
            flex-shrink: 0;
        }

        .log-content {
            font-family: monospace;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #d4c39e;
            flex-grow: 1;
        }

        /* Scaled-up text formatting when expanded */
        .tome-container.expanded .log-content {
            font-size: 15px;
            line-height: 1.6;
        }

        .highlight {
            color: #ff6b6b;
            font-weight: bold;
            background: rgba(255, 107, 107, 0.15);
            padding: 1px 4px;
            border-radius: 2px;
        }

        .occurrence-badge {
            color: #f3d283;
            background: rgba(243, 210, 131, 0.15);
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 6px;
        }

        .layman {
            color: #4df066;
            display: block;
            margin-top: 6px;
            margin-bottom: 18px;
            padding-left: 12px;
            border-left: 3px solid #4df066;
            font-size: 14px;
        }

        .tome-container.expanded .layman {
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="scene-stage">
        <img src="deckard.png" alt="Deckard Cain" class="cain-sprite" onerror="this.style.display='none'">
        <img src="tome.png" alt="Tome of Identify" class="tome-bg-asset" onerror="this.style.display='none'">

        <div class="tome-container" id="tomeContainer">
            <div class="header">
                <!-- Using tome.png for the header icon -->
                <img src="tome.png" alt="Tome Icon" class="header-tome-icon" onerror="this.style.display='none'">
                <h1>Identify Items</h1>
            </div>

            <p class="quote">"Stay awhile and listen... or paste your link below."</p>

            <div class="parchment">
                <label for="urlInput">Target URL to Identify:</label>
                <input type="text" id="urlInput" placeholder="https://example.com/legal/rules">
                
                <div class="btn-container">
                    <!-- Glass icon on the right side -->
                    <button onclick="processUrl()">Identify Item 🔍</button>
                </div>
            </div>

            <div class="output-box">
                <h3>Identified Result:</h3>
                <div id="output" class="log-content">Unidentified item awaits identification...</div>
            </div>
        </div>
    </div>
