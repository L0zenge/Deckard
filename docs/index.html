<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deckard Cain's Tome of Identification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0a08;
            background-image: radial-gradient(circle, #231812 0%, #0d0a08 100%);
            color: #d4c39e;
            font-family: 'MedievalSharp', cursive, serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Leather Tome Outer Container */
        .tome-container {
            background: #2b1a10;
            background-image: linear-gradient(135deg, #3d2517 0%, #1c100a 100%);
            border: 8px solid #5a3d28;
            outline: 3px solid #110b07;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(0, 0, 0, 0.8);
            max-width: 650px;
            width: 100%;
            padding: 30px;
            position: relative;
        }

        /* Gold Decorative Trim */
        .tome-container::before {
            content: '';
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border: 2px solid #8c6f3d;
            border-radius: 6px;
            pointer-events: none;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
            border-bottom: 2px solid #5a3d28;
            padding-bottom: 15px;
        }

        /* Deckard Sprite Slot */
        .deckard-sprite {
            width: 64px;
            height: 64px;
            object-fit: contain;
            image-rendering: pixelated; /* Keeps retro pixel art crisp */
            filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.4));
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #f3d283;
            font-size: 26px;
            text-shadow: 2px 2px 4px #000;
            letter-spacing: 1px;
            text-align: center;
        }

        p.quote {
            font-style: italic;
            color: #bfa882;
            text-align: center;
            margin-bottom: 25px;
            font-size: 18px;
            text-shadow: 1px 1px 2px #000;
        }

        /* Parchment Inner Input Area */
        .parchment {
            background-color: #d1be9c;
            background-image: linear-gradient(to bottom, #e2d2b4, #c2ae8a);
            color: #2b1a10;
            padding: 20px;
            border-radius: 4px;
            border: 2px solid #7a5c3f;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 8px;
            color: #3d2517;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #f7eed8;
            border: 2px solid #5a3d28;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
            color: #1c100a;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: #c9933b;
            box-shadow: 0 0 8px rgba(201, 147, 59, 0.6);
        }

        /* Scroll/Button Styling */
        .btn-container {
            text-align: center;
            margin-top: 15px;
        }

        button {
            background: linear-gradient(to bottom, #8a2be2, #4a0080); /* Scroll of Identify vibe, or bronze */
            background: linear-gradient(to bottom, #a87932, #5c3f15);
            color: #fff1d0;
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 30px;
            border: 2px solid #f3d283;
            border-radius: 6px;
            cursor: pointer;
            text-shadow: 1px 1px 3px #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }

        button:hover {
            background: linear-gradient(to bottom, #c9933b, #7a531d);
            transform: translateY(-2px);
            box-shadow: 0 0 12px rgba(243, 210, 131, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Result Section */
        .output-box {
            background: #110b07;
            border: 2px solid #5a3d28;
            border-radius: 4px;
            padding: 15px;
            margin-top: 20px;
        }

        .output-box h3 {
            font-family: 'Cinzel', serif;
            color: #f3d283;
            font-size: 16px;
            margin-bottom: 8px;
            border-bottom: 1px dashed #5a3d28;
            padding-bottom: 4px;
        }

        pre {
            font-family: monospace;
            color: #4df066; /* Retro terminal green for parsed text */
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="tome-container">
        <div class="header">
            <!-- Put your sprite file in the same docs folder as deckard.png -->
            <img src="deckard.png" alt="Deckard Cain" class="deckard-sprite" onerror="this.style.display='none'">
            <h1>Tome of Identification</h1>
        </div>

        <p.quote>"Stay awhile and listen... or paste your link below."</p>

        <div class="parchment">
            <label for="urlInput">Target URL to Identify:</label>
            <input type="text" id="urlInput" placeholder="https://example.com/item_to_parse">
            
            <div class="btn-container">
                <button onclick="processUrl()">Identify Item</button>
            </div>
        </div>

        <div class="output-box">
            <h3>Identified Result:</h3>
            <pre id="output">Unidentified item awaits identification...</pre>
        </div>
    </div>

    <script>
        function processUrl() {
            const url = document.getElementById('urlInput').value;
            const output = document.getElementById('output');

            if (!url) {
                output.textContent = "Error: You must provide an unidentified link!";
                output.style.color = "#ff6b6b";
                return;
            }

            output.style.color = "#4df066";
            
            // TODO: Plug in your JS regex/translation logic here!
            output.textContent = "Identified: " + url + "\n(Your regex translation logic runs here)";
        }
    </script>

</body>
</html>
