<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deckard Cain's Tome of Identification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: width 0.4s ease, height 0.4s ease, max-width 0.4s ease, max-height 0.4s ease;
        }

        body {
            background-color: #0d0a08;
            background-image: radial-gradient(circle, #231812 0%, #0d0a08 100%);
            color: #d4c39e;
            font-family: 'MedievalSharp', cursive, serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .scene-stage {
            position: relative;
            width: 780px;
            height: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cain-sprite {
            position: absolute;
            left: 0px;
            bottom: 20px;
            width: 200px;
            height: auto;
            object-fit: contain;
            image-rendering: pixelated;
            filter: drop-shadow(2px 5px 10px rgba(0,0,0,0.8));
            z-index: 1;
        }

        .tome-bg-asset {
            position: absolute;
            right: 40px;
            top: 20px;
            width: 380px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.9));
            z-index: 2;
            opacity: 0.95;
        }

        .tome-container {
            background: #2b1a10;
            background-image: linear-gradient(135deg, #3d2517 0%, #1c100a 100%);
            border: 6px solid #5a3d28;
            outline: 2px solid #110b07;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.95), inset 0 0 15px rgba(0, 0, 0, 0.8);
            width: 440px;
            height: 460px;
            padding: 20px;
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
        }

        .tome-container.expanded {
            width: 88vw !important;
            max-width: 1200px;
            height: 88vh !important;
        }

        .tome-container::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 2px solid #8c6f3d;
            border-radius: 6px;
            pointer-events: none;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
            border-bottom: 2px solid #5a3d28;
            padding-bottom: 8px;
            flex-shrink: 0;
        }

        .header-tome-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: drop-shadow(0 0 4px #f3d283);
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #f3d283;
            font-size: 20px;
            text-shadow: 2px 2px 4px #000;
            letter-spacing: 1px;
            text-align: center;
        }

        p.quote {
            font-style: italic;
            color: #bfa882;
            text-align: center;
            margin-bottom: 12px;
            font-size: 13px;
            text-shadow: 1px 1px 2px #000;
            flex-shrink: 0;
        }

        .parchment {
            background-color: #d1be9c;
            background-image: linear-gradient(to bottom, #e2d2b4, #c2ae8a);
            color: #2b1a10;
            padding: 10px 12px;
            border-radius: 4px;
            border: 2px solid #7a5c3f;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.3);
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 4px;
            color: #3d2517;
        }

        textarea {
            width: 100%;
            height: 55px;
            padding: 7px;
            background: #f7eed8;
            border: 2px solid #5a3d28;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            color: #1c100a;
            outline: none;
            resize: none;
            transition: all 0.2s ease;
        }

        textarea:focus {
            border-color: #c9933b;
            box-shadow: 0 0 6px rgba(201, 147, 59, 0.6);
        }

        .btn-container {
            text-align: center;
            margin-top: 6px;
        }

        button {
            background: linear-gradient(to bottom, #a87932, #5c3f15);
            color: #fff1d0;
            font-family: 'Cinzel', serif;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 18px;
            border: 2px solid #f3d283;
            border-radius: 4px;
            cursor: pointer;
            text-shadow: 1px 1px 3px #000;
            box-shadow: 0 3px 8px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            background: linear-gradient(to bottom, #c9933b, #7a531d);
            transform: translateY(-1px);
            box-shadow: 0 0 10px rgba(243, 210, 131, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        .output-box {
            background: #110b07;
            border: 2px solid #5a3d28;
            border-radius: 4px;
            padding: 12px;
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .output-box h3 {
            font-family: 'Cinzel', serif;
            color: #f3d283;
            font-size: 14px;
            margin-bottom: 8px;
            border-bottom: 1px dashed #5a3d28;
            padding-bottom: 4px;
            flex-shrink: 0;
        }

        .log-content {
            font-family: monospace;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #d4c39e;
            flex-grow: 1;
        }

        .tome-container.expanded .log-content {
            font-size: 14px;
            line-height: 1.6;
        }

        /* High Severity Threat Colors */
        .highlight-red {
            color: #ff6b6b;
            font-weight: bold;
            background: rgba(255, 107, 107, 0.15);
            padding: 1px 4px;
            border-radius: 2px;
        }

        .highlight-purple {
            color: #d182ff;
            font-weight: bold;
            background: rgba(186, 85, 211, 0.25);
            padding: 1px 4px;
            border-radius: 2px;
            border: 1px dashed #ba55d3;
        }

        .occurrence-badge {
            color: #f3d283;
            background: rgba(243, 210, 131, 0.15);
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 6px;
        }

        .layman-green {
            color: #4df066;
            display: block;
            margin-top: 6px;
            margin-bottom: 18px;
            padding-left: 12px;
            border-left: 3px solid #4df066;
            font-size: 14px;
        }

        .layman-purple {
            color: #e2a8ff;
            display: block;
            margin-top: 6px;
            margin-bottom: 22px;
            padding: 8px 12px;
            background: rgba(68, 20, 92, 0.35);
            border-left: 4px solid #ba55d3;
            border-radius: 0 4px 4px 0;
            font-size: 14px;
        }

        .tome-container.expanded .layman-green,
        .tome-container.expanded .layman-purple {
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="scene-stage">
        <img src="cain.gif" alt="Deckard Cain" class="cain-sprite" onerror="this.style.display='none'">
        <img src="tome.png" alt="Tome of Identify" class="tome-bg-asset" onerror="this.style.display='none'">

        <div class="tome-container" id="tomeContainer">
            <div class="header">
                <img src="tome.png" alt="Tome Icon" class="header-tome-icon" onerror="this.style.display='none'">
                <h1>Identify Items</h1>
            </div>

            <p class="quote">"Stay awhile and listen..."</p>
            <div class="parchment">
                <label for="textInput" >🔮 ... ... ... ... ...Intentions will be revealed... ... ... ... 📜</label>
                <textarea id="textInput" placeholder="Paste a web URL (https://...) or raw contract text directly..."></textarea>
                
                <div class="btn-container">
                    <button onclick="processInput()">Identify Items🔍</button>
               </div>
            </div>

            <div class="output-box">
                <h3>Deciphered and deobfuscated results:</h3>
                <div id="output" class="log-content">Unidentified item awaits identification...</div>
            </div>
        </div>
    </div>

    <script>
        const CATEGORY_INFO = {
            "winner_trap": {
                name: "☠️ WINNER FORFEITURE & TOTAL LIKENESS TRAP",
                severity: "purple",
                translation: "DANGER! If they label or select you as a 'Winner', you instantly surrender irrevocable rights to your name, likeness, audio, video, photos, and linked profile content in perpetuity, worldwide, without payment, notice, or recourse. They get perpetual commercial usage rights simply by handing out a nominal prize or title."
            },
            "perpetuity": {
                name: "🔮 IN PERPETUITY / LIFETIME LOCK",
                severity: "purple",
                translation: "This contract outlives you. Phrasing like 'in perpetuity', 'perpetual', or 'foreseeable future' means even if you delete your account, quit the platform, or pass away, they (and anyone they sell your work to) permanently retain the legal right to use, license, and monetize your content."
            },
            "media_trap": {
                name: "🔮 FUTURE MEDIA & 'HEREAFTER DISCOVERED' LOOPHOLE",
                severity: "purple",
                translation: "The ultimate AI and modern tech loophole. By pre-consenting to use in 'any and all media now known or hereafter discovered', you have given them prior authorization to take your audio, visual, or written creations and run them through AI training models or new digital synthesis engines developed in the future."
            },
            "derivative": {
                name: "🔮 DERIVATIVE WORKS & PARTIAL REPRODUCTION HOOK",
                severity: "purple",
                translation: "They claim the right to make 'reproductions in whole or in part' or create 'derivative works'. In AI audio/visual synthesis, this allows them to split your song into isolated stems, vocal timbres, or melodies to train internal AI engines that generate 'similar but legally different' content without paying you a cent."
            },
            "sublicense": {
                name: "🔮 THIRD-PARTY SUBLICENSING LAUNDERING",
                severity: "purple",
                translation: "They want the right to sublicense your work to third parties in perpetuity. Even if they claim they aren't directly training AI right now, they reserve the right to sell or lease your entire dataset to outside tech giants for profit later on while claiming their own hands are clean."
            },
            "ai_train": {
                name: "🔮 EXPLICIT AI MODEL & SYNTHETIC HARVEST",
                severity: "purple",
                translation: "They explicitly state that submitted materials will be used to train, feed, build, or synthesize algorithmic models or machine assets. Your artistic output becomes raw training fodder for automated tools."
            },
            "single_arbitrator": {
                name: "📜 SINGLE ARBITRATOR ABSOLUTE CONTROL",
                severity: "red",
                translation: "Any dispute you have is decided by ONE single corporate-selected arbitrator. That single individual holds final, unappealable say over all legal issues with no jury or court oversight."
            },
            "lawsuit_ban": {
                name: "📜 LAWSUIT & CLASS ACTION BAN",
                severity: "red",
                translation: "You waive your rights to take them to a public courtroom, participate in a jury trial, or join forces with other scammed creators in a class-action lawsuit. You must face them alone in private arbitration."
            },
            "bot_trap": {
                name: "📜 ARBITRARY DISQUALIFICATION & SCRIPT CLAUSE",
                severity: "red",
                translation: "They reserve unchecked authority to disqualify you or withhold earnings by alleging 'bot', 'script', or 'automated' manipulation without providing hard technical proof."
            }
        };

        const SCAM_PATTERN = /\b(?<winner_trap>(?:acceptance of a prize|winner['’]?s irrevocable consent|acceptance of (?:any|a) prize|irrevocable consent to operator|winner['’]?s name, likeness).+?(?:in perpetuity|without any permission|without compensation|submitted materials))|\b(?<sublicense>sub[- ]?licens(?:e|ing|able))|\b(?<perpetuity>in perpetuity|perpetual|foreseeable future)\b|\b(?<media_trap>any (?:and )?all media|hereafter discovered|now known or hereafter)\b|\b(?<derivative>deriv(?:a|i)tive work[s]?|reproduction[s]? (?:either )?in whole or in part)\b|\b(?<single_arbitrator>(?:single|sole|one) arbitrator)\b|\b(?<lawsuit_ban>waive[r]? (?:moral|class|jury)|class[- ]action|dispute[s]? resolved (?:exclusively )?by|agree not to sue|waive.*right to.*(?:sue|court|litigate))\b|\b(?<bot_trap>(?:bot|robot(?:ic)?|automat(?:ed|ion)|script|third[- ]party|3rd[- ]party).+?(?:tamper|cheat|disqual|manipulat))\b|\b(?<ai_train>(?:generat(?:e|ive)|train|feed|model|algorithm|synthesiz).+?(?:material|submit|work|content|data|submitted materials))\b/gi;

        function cleanHtml(htmlContent) {
            let text = htmlContent.replace(/<script[\s\S]*?>[\s\S]*?<\/script>/gi, '');
            text = text.replace(/<style[\s\S]*?>[\s\S]*?<\/style>/gi, '');
            text = text.replace(/<[^>]+>/g, ' ');
            text = text.replace(/\s+/g, ' ');
            return text;
        }

        async function fetchUrlText(url) {
            // Cleaned proxy setup to prevent hanging
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
            const response = await fetch(proxyUrl);
            if (!response.ok) {
                throw new Error("Target site rejected network reading request.");
            }
            const json = await response.json();
            return cleanHtml(json.contents);
        }

        async function processInput() {
            const rawInput = document.getElementById('textInput').value.trim();
            const output = document.getElementById('output');
            const tomeContainer = document.getElementById('tomeContainer');

            if (!rawInput) {
                output.innerHTML = '<span style="color: #ff6b6b;">Error: You must provide a URL or paste raw TOS text!</span>';
                return;
            }

            tomeContainer.classList.add('expanded');
            output.innerHTML = '<span style="color: #f3d283;">"Hello, my friend. Stay a while, and listen!" Uncapping scroll case and identifying dark clauses...</span>';

            let textToScan = rawInput;

            if (rawInput.startsWith('http://') || rawInput.startsWith('https://')) {
                try {
                    textToScan = await fetchUrlText(rawInput);
                } catch (error) {
                    output.innerHTML = `<span style="color: #ff6b6b;">[Cain] Could not fetch remote link automatically. Try copying the text from the link and pasting it directly into this box! Error: ${error.message}</span>`;
                    return;
                }
            } else {
                textToScan = cleanHtml(rawInput);
            }

            const sentences = textToScan.split(/(?<=[.!?])\s+/);
            const findingsMap = {};

            for (let sentence of sentences) {
                sentence = sentence.trim();
                if (!sentence) continue;

                SCAM_PATTERN.lastIndex = 0;
                let match = SCAM_PATTERN.exec(sentence);
                
                if (match && match.groups) {
                    for (let [groupName, value] of Object.entries(match.groups)) {
                        if (value !== undefined) {
                            if (!findingsMap[groupName]) {
                                findingsMap[groupName] = { count: 0, sample: sentence, matchedTerm: value };
                            }
                            findingsMap[groupName].count++;
                            break;
                        }
                    }
                }
            }

            let totalCategoriesFound = Object.keys(findingsMap).length;
            let resultsHtml = `<strong style="color: #d4c39e; font-size: 16px;">=== SCROLL IDENTIFICATION REPORT ===</strong><br><br>`;

            if (totalCategoriesFound === 0) {
                resultsHtml += `<span style="color: #4df066;">✓ "You have quite a treasure there! It appears clean of immediate corporate corruption."</span>`;
            } else {
                for (let [catKey, data] of Object.entries(findingsMap)) {
                    let meta = CATEGORY_INFO[catKey] || { name: "UNKNOWN THREAT", severity: "red", translation: "Obscure corporate legal jargon detected." };
                    
                    let highlightClass = meta.severity === "purple" ? "highlight-purple" : "highlight-red";
                    let laymanClass = meta.severity === "purple" ? "layman-purple" : "layman-green";

                    let highlightedSample = data.sample.replace(
                        data.matchedTerm, 
                        `<span class="${highlightClass}">${data.matchedTerm}</span>`
                    );

                    resultsHtml += `📜 <strong>Found Clause (${meta.name}):</strong> <span class="occurrence-badge">${data.count} Occurrence${data.count > 1 ? 's' : ''}</span><br>`;
                    resultsHtml += `... ${highlightedSample} ...<br>`;
                    resultsHtml += `<span class="${laymanClass}">💡 <strong>Layman Translation:</strong> ${meta.translation}</span>`;
                }

                resultsHtml += `<br><span style="color: #ff6b6b; font-weight: bold;">✖ "Our worst fears are realized. I have identified ${totalCategoriesFound} distinct dark clauses across the text. Do not sign this contract!"</span>`;
            }

            output.innerHTML = resultsHtml;
        }
    </script>
</body>
</html>
